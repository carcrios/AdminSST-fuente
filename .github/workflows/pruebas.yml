# Pruebas del Portal SSTA en cada subida.
#
# Si algo sale en rojo, GitHub marca la subida con ✗ y NO publica el sitio:
# la publicación (GitHub Pages) depende de que las pruebas pasen.
#
# Para activarlo una sola vez en el repositorio:
#   Settings → Pages → Build and deployment → Source: «GitHub Actions».
# (Con «Deploy from a branch» GitHub publica sin esperar las pruebas.)

name: Pruebas y publicación

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruebas:
    name: Pruebas (código y navegador)
    runs-on: ubuntu-latest
    timeout-minutes: 35   # v175: con el sitio minificado y 345 comprobaciones en navegador, 20 no alcanzan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # v163: el lint de seguridad (ESLint) es parte de pruebas.js; sin esto, en un clon limpio
      # no existe herramientas/lint/node_modules, las pruebas fallan y no se publica.
      - name: Instalar ESLint (lint de seguridad)
        working-directory: herramientas/lint
        run: npm ci --no-audit --no-fund

      # v174: los documentos comerciales (Word) se arman con «docx»; las pruebas revisan su tabla de módulos por plan.
      - name: Instalar docx (documentos comerciales) y el minificador
        run: |
          npm install --no-save --no-audit --no-fund --no-package-lock docx@9.8.1
          npm install --prefix herramientas --no-save --no-audit --no-fund --no-package-lock terser@5.51.2 clean-css@5.3.3

      - name: Pruebas del código (más de mil comprobaciones)
        run: node pruebas/pruebas.js

      # v165: la versión completa y consistente (misma versión en todos lados, CSP, núcleo sin señal,
      # servidor generado igual a backends/). Si el servidor generado cambia aquí, faltó regenerarlo y subirlo.
      - name: Versión completa y consistente
        run: |
          node herramientas/armar-common.js --check
          node herramientas/verificar-release.js --sin-guia
          git diff --exit-code -- servidor-unico servidor-todo-en-uno || (echo "::error::El servidor generado no coincide con backends/: corre node herramientas/armar-servidor-unico.js y súbelo" && exit 1)

      - name: Instalar Playwright y Chromium
        working-directory: pruebas
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # v174: sobre el sitio MINIFICADO, que es lo que se publica (igual que el empaquetador).
      - name: Pruebas en navegador (celular, permisos, sin señal, firmas)
        working-directory: pruebas
        env:
          SSTA_MIN: '1'
        run: node navegador.js

  seguridad:
    name: Dependencias y secretos
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vulnerabilidades conocidas en las herramientas de prueba y lint
        run: |
          (cd herramientas/lint && npm audit --audit-level=high) || true
          (cd pruebas && npm install --no-audit --no-fund && npm audit --audit-level=high) || true
      - name: Que no se haya colado un token o una clave
        run: |
          ! grep -rInE "AKfyc[A-Za-z0-9_-]{30,}|-----BEGIN (EC |RSA )?PRIVATE KEY|ssta-licencia-privada" --include=*.js --include=*.html --include=*.gs --exclude-dir=node_modules --exclude-dir=pruebas --exclude-dir=herramientas . || (echo "::error::Hay un posible secreto en el código" && exit 1)

  # v174: el código vive en este repositorio PRIVADO; el sitio se publica en el repositorio público carcrios/AdminSST
  # (GitHub Pages). Necesita el secreto ADMINSST_TOKEN (un token con permiso de escritura solo sobre AdminSST).
  # Sin el secreto, no falla: avisa y no publica.
  publicar:
    name: Publicar el sitio en AdminSST
    needs: pruebas
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Se publica solo el sitio: lo de desarrollo no va a internet
      # (mismas carpetas que excluye INSTALAR-NUEVA-EMPRESA.md).
      - name: Preparar el sitio
        run: |
          mkdir -p _sitio
          rsync -a ./ _sitio/ --exclude .git --exclude .github --exclude _sitio \
            --exclude backends --exclude pruebas --exclude herramientas --exclude sitio-demo --exclude comercial --exclude fuente \
            --exclude node_modules --exclude '*.md' --exclude '*.docx' --exclude servidor-unico --exclude .gitignore \
            --exclude servidor-todo-en-uno --exclude admin.html --exclude configurar-empresa.html --exclude asesor.html --exclude instalar.html --exclude consola.css --exclude menus-empresa.js   # v175: solo del proveedor (herramientas/empaquetar.js SOLO_PROVEEDOR)
          touch _sitio/.nojekyll

      - name: Minificar el sitio (lo mismo que se probó)
        run: |
          npm install --prefix herramientas --no-save --no-audit --no-fund --no-package-lock terser@5.51.2 clean-css@5.3.3
          node -e "require('./herramientas/minificar').carpeta('_sitio', false).then((n) => console.log('Minificado:', Math.round(n / 1024), 'KB menos'))"

      - name: Subir a carcrios/AdminSST
        env:
          TOKEN: ${{ secrets.ADMINSST_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::warning::Falta el secreto ADMINSST_TOKEN: no se publicó el sitio."; exit 0; fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/carcrios/AdminSST.git" _destino
          rsync -a --delete --exclude .git --exclude CNAME --exclude empresas/ _sitio/ _destino/   # --delete también BORRA del público lo que pasó a ser solo del proveedor
          cd _destino
          git config user.name "Publicación automática"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Sin cambios en el sitio."; exit 0; }
          git commit -m "Sitio desde AdminSST-fuente ${GITHUB_SHA::7}"
          git push
