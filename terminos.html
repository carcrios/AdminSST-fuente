<script>
OfflineBanner.init();
if (typeof UpdateManager !== 'undefined') UpdateManager.init();
/* v134 · Condiciones de uso. Plantilla: la empresa (y quien presta el portal) la revisa con su asesor legal. */
(function () {
  const E = EMPRESA, P = (typeof MultiEmpresa !== 'undefined' && MultiEmpresa.activo && MultiEmpresa.proveedor) || null;
  const emp = esc(E.nombre || 'la empresa');
  const prov = P && P.nombre && P.nombre !== E.nombre ? esc(P.nombre) : '';
  document.getElementById('terminos').innerHTML =
    '<div class="quien"><b>Quién ofrece el portal:</b> ' + emp + (prov ? ', con la plataforma que presta ' + prov : '') + '.<br>Al usar el portal aceptas estas condiciones. Si no estás de acuerdo, no lo uses y avisa al área SST.</div>' +
    '<h2>Para qué es</h2><p>Para registrar y consultar la gestión de seguridad y salud en el trabajo de ' + emp + ': preoperacionales, reportes, inspecciones, permisos, ATS, entregas de EPP, capacitaciones y demás registros del SG-SST.</p>' +
    '<h2>Lo que te comprometes a hacer</h2><ul>' +
      '<li>Escribir información verdadera y completa. Un registro falso puede poner en riesgo a otras personas.</li>' +
      '<li>Firmar solo por ti. Tu firma en el portal vale como tu firma en papel.</li>' +
      '<li>Cuidar tu usuario y tu clave: no los prestes. Lo que se haga con ellos queda a tu nombre.</li>' +
      '<li>Usar el portal solo para el trabajo, sin subir contenido ofensivo, ajeno al SG-SST ni datos de otras personas que no hagan falta.</li>' +
      '<li>No intentar entrar a lo que tu usuario no tiene permitido ni enviar registros en masa o automáticos.</li></ul>' +
    '<h2>Lo que el portal no reemplaza</h2><p>El portal es una herramienta de apoyo. No reemplaza la evaluación del riesgo en sitio, la autorización de quien debe darla, la atención de una emergencia (en una emergencia llama primero a la línea de emergencias y a tu jefe) ni el criterio del responsable del SG-SST. Las responsabilidades legales de la empresa y de cada trabajador siguen siendo las mismas (Decreto 1072 de 2015).</p>' +
    '<h2>Disponibilidad</h2><p>El portal funciona con internet y guarda en el celular lo que espera señal. Puede haber interrupciones por mantenimiento o por fallas de los servicios de Google. Si algo urgente no se puede registrar, hazlo por el medio alterno de la empresa y regístralo después.</p>' +
    '<h2>Tus datos</h2><p>El tratamiento de tus datos personales se rige por el <a href="privacidad.html">aviso de privacidad</a> (Ley 1581 de 2012).</p>' +
    '<h2>Propiedad</h2><p>Los registros son de ' + emp + '. El software del portal' + (prov ? ' es de ' + prov + ' y' : '') + ' se entrega para el uso descrito aquí; no se permite copiarlo, revenderlo ni modificarlo sin autorización.</p>' +
    '<h2>Cambios</h2><p>Estas condiciones se pueden actualizar; la versión vigente es la de esta página.</p>';
})();
</script>
